name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment on server..."
            
            # Navigate to monorepo and pull latest changes
            cd ~/projects/xflasar
            git reset --hard HEAD
            git pull origin main
            
            # Rebuild and restart portfolio-web via docker compose
            cd ~/projects/xflasar-infra
            docker compose build --no-cache portfolio-web
            docker compose up -d portfolio-web
            
            # Cleanup unused dangling images
            docker image prune -f
            
            echo "✅ Deployment successful!"
