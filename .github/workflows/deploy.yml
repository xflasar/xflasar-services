name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Update monorepo & rebuild portfolio
        run: |
          set -e
          echo "🚀 Deploying portfolio-web locally on server..."
          
          # Navigate to monorepo and pull latest changes
          cd ~/projects/xflasar
          git reset --hard HEAD
          git pull origin main
          
          # Navigate to infra repo and pull latest changes
          cd ~/projects/xflasar-infra
          git reset --hard HEAD
          git pull origin main || true
          
          # Rebuild and restart portfolio-web and anime-web via docker compose
          docker compose build --no-cache portfolio-web anime-web
          docker compose up -d portfolio-web anime-web
          
          # Cleanup unused dangling images
          docker image prune -f
          
          echo "✅ Deployment successful and live!"
